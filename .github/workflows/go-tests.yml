name: Go Automated Quality Checks

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Establish the Go runtime
    - name: Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'
        cache: true

    # 2. Install the native Linux headers AND xvfb (the virtual screen server)
    - name: Install Linux Graphics and Audio Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libgl1-mesa-dev \
          libxcursor-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxxf86vm-dev \
          pkg-config \
          xvfb

    # 3. Download Go modules
    - name: Install Project Dependencies
      run: go mod download

    # 4. Execute the tests wrapped inside a virtual framebuffer shell
    - name: Execute Test Suite
      run: xvfb-run go test -v ./...